name: Compilar chiaki-ng ARK (Windows)

# Se ejecuta al subir este archivo; se puede relanzar desde la pestana Actions > Run workflow
on:
  push:
  workflow_dispatch:

jobs:
  build-windows:
    name: chiaki-ng ARK win_x64
    timeout-minutes: 120
    runs-on: windows-latest
    env:
      sdl2_compat_tag: 2.32.64
    defaults:
      run:
        shell: msys2 {0}
