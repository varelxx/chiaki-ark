name: Compilar chiaki-ng ARK (Linux AppImage)

# Se ejecuta al subir o cambiar este archivo; se puede relanzar desde Actions > Run workflow
on:
  push:
    paths:
      - '.github/workflows/build-ark-linux.yml'
  workflow_dispatch:

jobs:
  build-appimage:
    name: chiaki-ng ARK AppImage x86_64
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Setup Podman
        run: |
          sudo apt update
          sudo apt-get -y install podman

      - name: Descargar chiaki-ng
        uses: actions/checkout@v4
        with:
          repository: streetpea/chiaki-ng
          ref: c8bea2642d0e95402f373af55584a3b98cd89417
          submodules: 'recursive'
          path: 'chiaki-ng'

